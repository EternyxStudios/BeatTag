<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0713" />

  <title>BeatTag — Beat It. Tag Them. Keep It Going.</title>

<meta

  content="BeatTag is a social challenge platform where you create challenges, beat your friends, share your attempts and keep the challenge chain going."
>

<meta

>

  content="EternyxStudios"
>

  rel="canonical"
  href="https://eternyxstudios.github.io/BeatTag/"
>

<!-- Open Graph / WhatsApp / Facebook -->
<meta

  content="BeatTag — Beat It. Tag Them. Keep It Going."
>

<meta

  content="Create challenges, beat your friends and keep the challenge chain going 🔥"
>

<meta
  property="og:type"
  content="website"
>

<meta
  property="og:url"
  content="https://eternyxstudios.github.io/BeatTag/"
>

<meta

  content="https://eternyxstudios.github.io/BeatTag/icon-512.png"
>

<meta

  content="BeatTag"
>

<!-- X / Twitter -->
<meta
  name="twitter:card"
  content="summary_large_image"
>

<meta
  name="twitter:title"
  content="BeatTag — Beat It. Tag Them. Keep It Going."
>

<meta
  name="twitter:description"
  content="Create challenges, beat your friends and keep the challenge chain going 🔥"
>

<meta
  name="twitter:image"
  content="https://eternyxstudios.github.io/BeatTag/icon-512.png"
>

<!-- PWA / Icons -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="styles.css">
</head>

<body>
<div id="authScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-logo">BEAT<span>TAG</span></div>
    <h2 id="authTitle">Login</h2>

    <input id="authName" type="text" placeholder="Name" class="auth-only-signup hidden">
    <input id="authUsername" type="text" placeholder="Username" class="auth-only-signup hidden">
    <input id="authEmail" type="email" placeholder="Email">
    <input id="authPassword" type="password" placeholder="Password">

    <button id="authSubmitBtn" class="primary" onclick="submitAuth()">Login</button>

    <p id="authMessage"></p>

    <button class="auth-switch" onclick="toggleAuthMode()">
      <span id="authSwitchText">Don't have an account? Sign Up</span>
    </button>
  </div>
</div>

<div id="app">

  <!-- TOP HEADER -->
  <header class="topbar">

    <div style="display:flex;align-items:center;gap:8px;position:relative;min-width:0;">

      <div class="brand" onclick="go('home')" style="cursor:pointer;white-space:nowrap;">
        BEAT<span>TAG</span>
      </div>

      <button
        type="button"
        onclick="toggleInfoMenu(event)"
        aria-label="BeatTag information"
        title="BeatTag Info"
        style="
          width:30px;
          height:30px;
          min-width:30px;
          border-radius:50%;
          border:1px solid rgba(196,75,255,.45);
          background:linear-gradient(145deg,#1a1025,#100a17);
          color:#d890ff;
          font-size:18px;
          font-weight:800;
          display:flex;
          align-items:center;
          justify-content:center;
          cursor:pointer;
          padding:0;
          box-shadow:0 0 16px rgba(187,56,255,.12);
        "
      >
        ⓘ
      </button>

      <div
        id="beatTagInfoMenu"
        class="hidden"
        style="
          position:absolute;
          top:42px;
          left:0;
          width:min(280px,calc(100vw - 32px));
          padding:12px;
          border:1px solid rgba(196,75,255,.45);
          border-radius:18px;
          background:
            radial-gradient(circle at top right,rgba(181,54,255,.20),transparent 36%),
            linear-gradient(145deg,#181020,#0d0913);
          box-shadow:
            0 18px 45px rgba(0,0,0,.68),
            0 0 28px rgba(187,56,255,.15);
          backdrop-filter:blur(18px);
          -webkit-backdrop-filter:blur(18px);
          z-index:9999;
          overflow:hidden;
        "
      >

        <div
          style="
            display:flex;
            align-items:center;
            gap:9px;
            padding:8px 10px 12px;
            margin-bottom:4px;
            border-bottom:1px solid rgba(255,255,255,.07);
          "
        >
          <span style="font-size:18px;">ⓘ</span>

          <div>
            <div style="font-size:14px;font-weight:800;color:#d890ff;">
              BeatTag Info
            </div>

            <div style="font-size:11px;color:#9e92aa;margin-top:2px;">
              About, policies &amp; support
            </div>
          </div>
        </div>

        <a
          href="about.html"
          style="
            display:flex;
            align-items:center;
            gap:10px;
            padding:12px 13px;
            margin:5px 0;
            color:#fff;
            text-decoration:none;
            border-radius:12px;
            background:rgba(255,255,255,.045);
            border:1px solid rgba(255,255,255,.06);
            font-weight:650;
          "
        >
          <span>ℹ️</span>
          <span>About</span>
        </a>

        <a
          href="contact.html"
          style="
            display:flex;
            align-items:center;
            gap:10px;
            padding:12px 13px;
            margin:5px 0;
            color:#fff;
            text-decoration:none;
            border-radius:12px;
            background:rgba(255,255,255,.045);
            border:1px solid rgba(255,255,255,.06);
            font-weight:650;
          "
        >
          <span>✉️</span>
          <span>Contact</span>
        </a>

        <a
          href="community-guidelines.html"
          style="
            display:flex;
            align-items:center;
            gap:10px;
            padding:12px 13px;
            margin:5px 0;
            color:#fff;
            text-decoration:none;
            border-radius:12px;
            background:rgba(255,255,255,.045);
            border:1px solid rgba(255,255,255,.06);
            font-weight:650;
          "
        >
          <span>👥</span>
          <span>Community Guidelines</span>
        </a>

        <a
          href="privacy.html"
          style="
            display:flex;
            align-items:center;
            gap:10px;
            padding:12px 13px;
            margin:5px 0;
            color:#fff;
            text-decoration:none;
            border-radius:12px;
            background:rgba(255,255,255,.045);
            border:1px solid rgba(255,255,255,.06);
            font-weight:650;
          "
        >
          <span>🔒</span>
          <span>Privacy Policy</span>
        </a>

        <a
          href="terms.html"
          style="
            display:flex;
            align-items:center;
            gap:10px;
            padding:12px 13px;
            margin:5px 0;
            color:#fff;
            text-decoration:none;
            border-radius:12px;
            background:rgba(255,255,255,.045);
            border:1px solid rgba(255,255,255,.06);
            font-weight:650;
          "
        >
          <span>📄</span>
          <span>Terms &amp; Conditions</span>
        </a>

      </div>

    </div>

    <div class="top-actions">

      <button class="coin-pill" onclick="go('shop')">
        🪙 <span id="coinCount">0</span>
      </button>

      <button class="icon-btn" onclick="openNotifications()">
        🔔
        <span id="notifDot" class="dot hidden"></span>
      </button>

    </div>

  </header>


  <!-- MAIN SCREEN -->
  <main id="screen"></main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button
      data-tab="home"
      onclick="go('home')">
      <span>⌂</span>
      <small>Home</small>
    </button>

    <button
      data-tab="explore"
      onclick="go('explore')">
      <span>⌕</span>
      <small>Explore</small>
    </button>

    <button
      data-tab="featured"
      onclick="go('featured')">
      <span>⭐</span>
      <small>Featured</small>
    </button>

    <button
      class="create-nav"
      data-tab="create"
      onclick="go('create')">
      <span>＋</span>
    </button>

    <button
      data-tab="chains"
      onclick="go('chains')">
      <span>⛓</span>
      <small>Chains</small>
    </button>

    <button
      data-tab="shop"
      onclick="go('shop')">
      <span>🛍</span>
      <small>Shop</small>
    </button>

    <button
      data-tab="profile"
      onclick="go('profile')">
      <span>☺</span>
      <small>Profile</small>
    </button>

  </nav>

</div>


<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-card" id="modalCard"></div>
</div>


<!-- CHALLENGE CARD TEMPLATE -->
<template id="challengeCardTpl">

  <article class="challenge-card">

    <div class="card-head">

      <div class="avatar">
        M
      </div>

      <div class="userline">

        <strong class="creatorName">
          User
        </strong>

        <span class="meta"></span>

      </div>

      <button class="dots">
        •••
      </button>

    </div>


    <div class="challenge-title"></div>


    <div class="media-wrap"></div>


    <div class="reaction-row">

      <button class="react likeBtn">
        ❤️ <span>0</span>
      </button>

      <button class="react dislikeBtn">
        👎 <span>0</span>
      </button>

      <button class="react commentBtn">
        💬 <span>0</span>
      </button>

      <button class="shareBtn">
        ↗
      </button>

    </div>


    <div class="action-row">

      <button class="primary beatBtn">
        🔥 BEAT IT
      </button>

      <button class="secondary tagBtn">
        👥 TAG FRIEND
      </button>

    </div>


    <div class="chainline"></div>

  </article>

</template>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker
    .register("./sw.js")
    .then(registration => {
      registration.update();
    })
    .catch(() => {});
}
</script>

<script>
function toggleInfoMenu(event) {
  event.stopPropagation();

  const menu = document.getElementById("beatTagInfoMenu");

  if (menu) {
    menu.classList.toggle("hidden");
  }
}

document.addEventListener("click", function(event) {
  const menu = document.getElementById("beatTagInfoMenu");

  if (menu && !menu.contains(event.target)) {
    menu.classList.add("hidden");
  }
});
</script>

</body>
</html>
